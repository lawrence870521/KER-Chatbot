<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KER AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 12px; color: #888; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #1a1a2e;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #fff;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .tool-indicator {
      align-self: flex-start;
      background: #e8f4fd;
      border: 1px solid #b3d9f2;
      color: #1565c0;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-indicator::before {
      content: "🔍";
    }

    .typing-indicator {
      align-self: flex-start;
      background: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .typing-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #999;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    #input-area {
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #1a1a2e; }

    #send-btn {
      background: #1a1a2e;
      color: #fff;
      border: none;
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover { opacity: 0.8; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      background: #fff;
      border-top: 1px solid #f0f0f0;
    }

    .quick-btn {
      background: #f0f2f5;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      color: #444;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .quick-btn:hover {
      background: #1a1a2e;
      color: #fff;
      border-color: #1a1a2e;
    }

    .welcome {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 40px 20px;
    }

    .welcome h2 { color: #555; font-size: 18px; margin-bottom: 8px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <div class="status-dot"></div>
    <h1>KER AI Assistant</h1>
    <span>Key Equipment Report Chatbot</span>
  </header>

  <div id="chat-container">
    <div class="welcome">
      <h2>👋 您好，我是 KER AI 助理</h2>
      <p>您可以詢問設備效率、Lost Time、OEE 排名等問題</p>
    </div>
  </div>

  <div class="quick-questions">
    <button class="quick-btn" onclick="sendQuick('今天 KER 狀況如何？')">今天 KER 狀況</button>
    <button class="quick-btn" onclick="sendQuick('今天 OEE 最差的機台是哪台？')">最差機台</button>
    <button class="quick-btn" onclick="sendQuick('今天 Lost Time 最多的機台？')">Lost Time 排名</button>
    <button class="quick-btn" onclick="sendQuick('哪些設備今天需要注意？')">需要注意的設備</button>
    <button class="quick-btn" onclick="sendQuick('今天各機台的 OEE 比較')">OEE 比較</button>
  </div>

  <div id="input-area">
    <textarea
      id="user-input"
      placeholder="詢問關於 KER 的問題，例如：今天哪台機台 OEE 最低？"
      rows="1"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let conversationHistory = [];
    let isStreaming = false;

    // 自動調整 textarea 高度
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    // Enter 送出（Shift+Enter 換行）
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendQuick(text) {
      userInput.value = text;
      sendMessage();
    }

    function addMessage(role, content) {
      // 移除 welcome 訊息
      const welcome = document.querySelector('.welcome');
      if (welcome) welcome.remove();

      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      chatContainer.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addToolIndicator(toolName, toolInput) {
      const div = document.createElement('div');
      div.className = 'tool-indicator';
      const labels = {
        get_ker_summary: '查詢 KER 總覽',
        get_equipment_oee: `查詢 OEE (${toolInput.equipment || ''})`,
        get_equipment_detail: `查詢 ${toolInput.name || ''} 詳細資料`,
        get_losttime_ranking: '查詢 Lost Time 排名',
        get_equipment_trend: `查詢 ${toolInput.name || ''} 趨勢`,
        get_ker_by_date_range: '查詢日期區間 KER',
      };
      div.textContent = labels[toolName] || `呼叫 ${toolName}`;
      chatContainer.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      div.id = 'typing';
      chatContainer.appendChild(div);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
    }

    function removeToolIndicators() {
      document.querySelectorAll('.tool-indicator').forEach(el => el.remove());
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      userInput.value = '';
      userInput.style.height = 'auto';

      // 顯示使用者訊息
      addMessage('user', text);
      addTypingIndicator();

      // 建立 assistant 訊息容器（稍後填入）
      let assistantDiv = null;
      let assistantText = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history: conversationHistory,
          }),
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // 保留未完整的行

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (data === '[DONE]') break;

            try {
              const parsed = JSON.parse(data);

              if (parsed.type === 'tool_call') {
                removeTypingIndicator();
                addToolIndicator(parsed.tool, parsed.input);

              } else if (parsed.type === 'text') {
                // 第一個 text chunk：建立 assistant 訊息框
                if (!assistantDiv) {
                  removeTypingIndicator();
                  removeToolIndicators();
                  assistantDiv = document.createElement('div');
                  assistantDiv.className = 'message assistant';
                  chatContainer.appendChild(assistantDiv);
                }
                assistantText += parsed.content;
                assistantDiv.textContent = assistantText;
                scrollToBottom();

              } else if (parsed.type === 'error') {
                removeTypingIndicator();
                removeToolIndicators();
                addMessage('assistant', `❌ 錯誤：${parsed.content}`);
              }
            } catch (_) {
              // 忽略 JSON 解析錯誤
            }
          }
        }

        // 更新對話歷史
        if (assistantText) {
          conversationHistory.push({ role: 'user', content: text });
          conversationHistory.push({ role: 'assistant', content: assistantText });
          // 只保留最近 10 輪對話
          if (conversationHistory.length > 20) {
            conversationHistory = conversationHistory.slice(-20);
          }
        }

      } catch (err) {
        removeTypingIndicator();
        removeToolIndicators();
        addMessage('assistant', `❌ 連線錯誤：${err.message}\n\n請確認後端伺服器是否正常運作。`);
      }

      isStreaming = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  </script>
</body>
</html>
